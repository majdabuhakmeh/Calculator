<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="calculator">

        <div class="history" id="history"></div>

        <input type="text" id="screen" class="screen" value="0" readonly>

        <div class="keys">
            <button class="key key--fn" data-action="clear">AC</button>
            <button class="key key--fn" data-action="backspace" aria-label="Remove last digit">⌫</button>
            <button class="key key--fn" data-action="clear-entry">CE</button>
            <button class="key key--op" data-action="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key key--op" data-action="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key key--op" data-action="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key key--op" data-action="+">+</button>

            <button class="key key--zero" data-value="0">0</button>
            <button id="decimal" class="key" data-value=".">.</button>
            <button class="key key--op key--equals" data-action="=">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
